<div class="dg-figure" data-fig="fig-3-2" style="--dg-w:864px"><div class="dg-scroll"><svg class="dg" viewBox="0 0 864 584" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-3-2-title fig-3-2-desc">
<title id="fig-3-2-title">The resale trio&#x27;s opportunity solution tree</title>
<desc id="fig-3-2-desc">A tree read from left to right, as it stood at the end of month two. The root is the product outcome: verified resales completed per eligible event. It branches into six opportunities, each with whose need it is and how many interviews raised it, out of 22 organizer and 31 fan interviews. Organizer: &#x27;I want to decide when and whether my shows are resold&#x27;, raised unprompted in 19 of 22 and by all six design-partner promoters, the strongest finding; solutions are a rules console with a window, per-fan limits and an off switch, or rules set by account managers on request; first test a clickable rules screen with six promoters. Organizer: &#x27;Touts end up in my front rows&#x27;, 14 of 22; solutions: resale buyers pass Bot Screening, per-buyer limits; test: count rule breaches in the hand-run pilot. Organizer: &#x27;I get nothing when my tickets are resold&#x27;, 8 of 22; solution: a share of the resale fee; test: willingness-to-pay talks in Chapter 5. Seller: &#x27;I&#x27;m afraid of being blamed if the ticket fails&#x27;, 17 of 31; solutions: reissue under a new barcode, a &#x27;your ticket sold&#x27; confirmation; test: hand-run reissue at four shows. Buyer: &#x27;I&#x27;m afraid the ticket won&#x27;t open the gate&#x27;, 21 of 31; solutions: a Verified badge, guarantee wording; test: entry refusals in the pilot. Partner, Rowmate, in all six conversations: &#x27;Duplicated tickets cost me chargebacks&#x27;; solution: reissue, so a ticket exists once; test: Rowmate&#x27;s chargeback data from Partner Listings.</desc>
