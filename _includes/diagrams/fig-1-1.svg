<div class="dg-figure" data-fig="fig-1-1" style="--dg-w:864px"><div class="dg-scroll"><svg class="dg" viewBox="0 0 864 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-1-1-title fig-1-1-desc">
<title id="fig-1-1-title">HealthCare.gov, October 2013 to August 2014</title>
<desc id="fig-1-1-desc">A timeline of HealthCare.gov&#x27;s first ten months, with events in order but not to scale. Above the line is what the organization did; below it is what users experienced. 1 October 2013: the site opens on the date the White House had promised, built under about 60 contracts with no declared business owner; about 250,000 people try to use it at once, it is failing within two hours, and only six people manage to submit an application and select a plan that day. Third week of October to early December 2013: the repair, in which outside engineers under Jeff Zients and Todd Park first build a dashboard of the site&#x27;s health, and CMS staff and contractors work as one badgeless team with ruthless prioritization; until then nobody could see what users were experiencing. Early December 2013: the site serves at least 50,000 people at once and uptime has risen from 43% to 95%. 1 January 2014: coverage begins, the only date the law required. End of the first open enrollment, 2014: 5.4 million people have selected a plan through the federal marketplace. August 2014: the US Digital Service is founded, and its Digital Services Playbook&#x27;s sixth play says to assign one leader and hold that person accountable.</desc>
