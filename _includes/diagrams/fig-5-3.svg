<div class="dg-figure" data-fig="fig-5-3" style="--dg-w:864px"><div class="dg-scroll"><svg class="dg" viewBox="0 0 864 416" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-5-3-title fig-5-3-desc">
<title id="fig-5-3-title">One resale, three ways</title>
<desc id="fig-5-3-desc">Three rows, each a €60 ticket resold at its face value, the original price the seller paid with primary fees included. Left of each row, a bar of what the buyer pays; right, the 10% fee enlarged and split in points of the resale price. Row one, bought through a partner: the buyer pays €66.00, the seller receives €60.00, and the €6.00 fee splits into €2.40 for the partner (four points), €1.80 for the organizer (three) and €1.80 for Encore (three). Row two, bought in Encore&#x27;s own app: the buyer pays €66.00, the seller receives €60.00, there is no partner, and Encore keeps the partner&#x27;s four points, so the organizer receives €1.80 and Encore €4.20. Row three, an event designated under Ireland&#x27;s Sale of Tickets Act, bought through a partner: the buyer&#x27;s total is held at the €60 face value, the fee comes out of the seller&#x27;s proceeds, so the seller receives €54.00, and the fee splits €2.40, €1.80 and €1.80 as in row one. A dashed line marks face value, the cap. The seller is paid five days after the event; the split is the same for every organizer on every tier.</desc>
