<div class="dg-figure" data-fig="fig-8-3" style="--dg-w:864px"><div class="dg-scroll"><svg class="dg" viewBox="0 0 864 404" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-8-3-title fig-8-3-desc">
<title id="fig-8-3-title">How long a defect lives</title>
<desc id="fig-8-3-desc">A schematic, not to scale. On the web a defect lives from the deploy that introduced it to the deploy that removed it, minutes with a good pipeline, and the next visitor never sees the old version. In a native app the fix has three parts, and only the first is under our control: build and test the fix; pass store review, where Apple states that on average 90% of submissions are reviewed in less than 24 hours, with an expedited review for critical fixes; and wait for fans to update, some the same day, many within a week, while a stubborn minority never do. Taken together: a day or more to ship the fix, days to weeks before most users have it, and months before nearly all of them do.</desc>
