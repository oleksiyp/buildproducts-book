<div class="dg-figure" data-fig="fig-9-6" style="--dg-w:864px"><div class="dg-scroll"><svg class="dg" viewBox="0 0 864 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-9-6-title fig-9-6-desc">
<title id="fig-9-6-title">Encore&#x27;s webhook retry schedule</title>
<desc id="fig-9-6-desc">Time after the event runs left to right, not to scale. Attempt 1 is immediate, and the delivery is logged with its status code and latency. Attempts 2 to 4 come at 30 seconds, 2 minutes and 10 minutes, and the event is marked retrying with its next attempt time. Attempts 5 to 7 come at 30 minutes, 1 hour and 3 hours, and the endpoint&#x27;s health turns amber in the portal. From attempt 8 onward, delivery is retried every 6 hours; after 24 hours of continuous failure the partner&#x27;s technical contacts get an email and a portal banner. At 72 hours the endpoint is disabled with notice, and its events are kept for replay for 14 days. Partners may shorten the total window to 24 hours or choose other intervals within bounds.</desc>
<defs><marker id="fig-9-6-m-muted" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="dg-head dg-head-muted" points="0 0, 8 3, 0 6"/></marker><marker id="fig-9-6-m-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="dg-head dg-head-accent" points="0 0, 8 3, 0 6"/></marker><marker id="fig-9-6-m-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="dg-head dg-head-link" points="0 0, 8 3, 0 6"/></marker></defs>
