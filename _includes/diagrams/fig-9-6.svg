<text class="dg-name" x="232" y="176">Retrying</text>
<rect class="dg-mask" x="352" y="152" width="316" height="40" rx="6"/>
<rect class="dg-n dg-n-backend" x="352" y="152" width="316" height="40" rx="6"/>
<text class="dg-name" x="510" y="176">Health amber</text>
<rect class="dg-mask" x="672" y="152" width="132" height="40" rx="6"/>
<rect class="dg-n dg-n-backend" x="672" y="152" width="132" height="40" rx="6"/>
<text class="dg-name" x="738" y="176">Email + banner</text>
<text class="dg-eyebrow" x="24" y="32" style="text-anchor:start">ONE EVENT TO A FAILING ENDPOINT · TIME AFTER THE EVENT, NOT TO SCALE</text>
<text class="dg-name" x="72" y="80">1</text>
