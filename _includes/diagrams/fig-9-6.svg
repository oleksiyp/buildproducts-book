<text class="dg-note" x="28" y="226" text-anchor="start">and latency</text>
<text class="dg-note" x="120" y="212" text-anchor="start">event marked &quot;retrying&quot;,</text>
<text class="dg-note" x="120" y="226" text-anchor="start">next attempt time shown</text>
<text class="dg-note" x="356" y="212" text-anchor="start">endpoint health turns amber</text>
<text class="dg-note" x="356" y="226" text-anchor="start">in the portal, and stays so</text>
<text class="dg-note" x="676" y="212" text-anchor="start">after 24 h of failure,</text>
<text class="dg-note" x="676" y="226" text-anchor="start">to technical contacts</text>
<text class="dg-note" x="800" y="264" text-anchor="end">72 h: endpoint disabled with notice; events kept for replay for 14 days</text>
<text class="dg-note" x="800" y="280" text-anchor="end">Partners may shorten the window to 24 h, or choose intervals within bounds</text>
