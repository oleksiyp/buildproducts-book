<div class="dg-figure" data-fig="fig-5-5" style="--dg-w:864px"><div class="dg-scroll"><svg class="dg" viewBox="0 0 864 468" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-5-5-title fig-5-5-desc">
<title id="fig-5-5-title">From reissue to invoice</title>
<desc id="fig-5-5-desc">Top left, a listing&#x27;s lifecycle: listed, reserved, sold, reissued. The partner&#x27;s commission is accrued at the sale, but billing starts only at the reissue, when the seller&#x27;s old barcode has been revoked and the buyer&#x27;s issued. Only then does the Resale service emit ResaleCompleted, a usage event written once with an idempotency key, which carries the facts of the sale and none of the money. Rating applies to it the entry of the bitemporal price book, recorded with a valid-from date and a recorded-at date, that was in force on the event&#x27;s date. From the rated event three documents are derived: the organizer&#x27;s payout line for its three points, the partner&#x27;s monthly statement line for its four points, and the finance ledger, reconciled daily. The seller is paid, and the partner&#x27;s commission released, five days after the event. Four checks run every night: one rated line per event and one event per line; the parts sum to the buyer&#x27;s total, €66 being €60 to the seller plus three shares of the fee; the day&#x27;s billing splits equal the day&#x27;s ledger entries; and each line was rated by the price-book entry valid on its date.</desc>
