<text class="dg-eyebrow" x="24" y="32" style="text-anchor:start">ONE RESALE · FACTS IN THE EVENT, PRICES IN THE BOOK, DOCUMENTS DERIVED FROM BOTH</text>
<text class="dg-note" x="432" y="412" text-anchor="start">seller paid, and partner commission released, five days after the event</text>
<text class="dg-note" x="28" y="224" xml:space="preserve">1 · one rated line per event, one event per line</text>
<text class="dg-note" x="28" y="244" xml:space="preserve">2 · the parts sum to the buyer's total:</text>
<text class="dg-note" x="28" y="264" xml:space="preserve">    €66 = €60 to the seller + three shares</text>
<text class="dg-note" x="28" y="284" xml:space="preserve">3 · the day's billing splits = the day's ledger</text>
<text class="dg-note" x="28" y="304" xml:space="preserve">4 · each line rated by the entry valid on its date</text>
<text class="dg-note" x="28" y="336" text-anchor="start">every number paid out can be recomputed</text>
<text class="dg-note" x="28" y="352" text-anchor="start">from the events and the price book as they stood</text>
