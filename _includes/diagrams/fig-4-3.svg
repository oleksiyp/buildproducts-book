<div class="dg-figure" data-fig="fig-4-3" style="--dg-w:864px"><div class="dg-scroll"><svg class="dg" viewBox="0 0 864 364" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-4-3-title fig-4-3-desc">
<title id="fig-4-3-title">Sample size for the sold-out page</title>
<desc id="fig-4-3-desc">Fans needed in each arm, from 16 sigma squared over delta squared with sigma squared 0.16 (about 80% of fans leave the sold-out page with no next step), against the smallest change worth detecting, at about 70,000 triggered fans a week in France. A 2-point change (80% to 78%) needs 6,400 fans per arm, 12,800 in total, under one week, run for two. 1 point, the pre-registered minimum, needs 25,600 per arm, 51,200 in total, also under one week, run for two. 0.5 points needs 102,400 per arm, 204,800 in total, about three weeks. 0.25 points needs 409,600 per arm, 819,200 in total, about twelve weeks. Halving the effect quadruples the fans needed.</desc>
