<div class="dg-figure" data-fig="fig-7-4" style="--dg-w:864px"><div class="dg-scroll"><svg class="dg" viewBox="0 0 864 476" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-7-4-title fig-7-4-desc">
<title id="fig-7-4-title">From local to shared in Setlist</title>
<desc id="fig-7-4-desc">A flow in two lanes. In the top lane, owned by the team that built it: a team builds a component in its own code, in Setlist&#x27;s style; it registers it in the library as a pattern candidate, visible to every team but owned by its maker and with no promise of support; then the question is whether a second team needs it. If not, it stays a candidate and the core never absorbs it. If so, the flow moves to the bottom lane, owned by the Design System team: the two teams and the core review it against Setlist&#x27;s criteria (useful, unique, accessible to the component contract of Section 6.4, documented, and free of business logic), and then the core team takes ownership and releases it. Below, the Verified Resale example: VerifiedBadge and ReissueStatus began as candidates in the Resale team&#x27;s code during the prototype; Mobile App needed both for the app&#x27;s resale module and Fan Messaging needed ReissueStatus for the &#x27;your ticket sold&#x27; email; the accessibility review found that the badge conveyed &#x27;verified&#x27; by color and an icon alone, and the promoted version carries a visible label.</desc>
