<div class="dg-figure" data-fig="fig-9-1" style="--dg-w:864px"><div class="dg-scroll"><svg class="dg" viewBox="0 0 864 536" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-9-1-title fig-9-1-desc">
<title id="fig-9-1-title">Twitter&#x27;s clients, 2006–2023</title>
<desc id="fig-9-1-desc">A schematic timeline in three columns. Courtship, then a warning, 2006 to 2011: Twitter launches in July 2006 with an API open early; the Iconfactory&#x27;s Twitterrific for Mac arrives in January 2007, giving Twitter its first bird icon and popularizing the word tweet; Twitter buys Tweetie in 2010, which becomes its official iPhone app; on 11 March 2011 Ryan Sarver tells developers not to build client apps that mimic or reproduce the mainstream Twitter consumer client experience; in May 2011 Twitter buys TweetDeck, reportedly for about 40 million dollars. The rules, with notice, 2012 to 2013, highlighted: on 16 August 2012 Michael Sippey announces API version 1.1 and new Developer Rules of the Road: authentication on every endpoint, 60 calls an hour per endpoint (720 for a few) in place of a flat 350, Display Requirements, certification for pre-installed client apps, and Twitter&#x27;s permission above 100,000 user tokens, with apps already past that line allowed to grow to 200 percent of their count; version 1.1 ships on 5 September 2012 with six months promised to migrate; Tweetbot for Mac ships on 18 October 2012 at 19.99 dollars because its token allotment is fixed; in March 2013 version 1.0&#x27;s retirement moves to 7 May with blackout tests; on 11 June 2013 version 1.0 returns 410 Gone. Every endpoint kept working. The cut-off, without notice, 2022 to 2023, highlighted: Elon Musk&#x27;s ownership begins in late October 2022; around 12 and 13 January 2023 Tweetbot, Twitterrific, Echofon and other clients stop working with no notice; on 17 January @TwitterDev says Twitter is enforcing its long-standing API rules; on 19 January the Developer Agreement bars building a substitute or similar service or product, and the Iconfactory ends Twitterrific after 16 years. The written rule came a week after the act.</desc>
