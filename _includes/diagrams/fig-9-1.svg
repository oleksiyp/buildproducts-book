<text class="dg-eyebrow" x="24" y="36" style="text-anchor:start">TWITTER AND ITS THIRD-PARTY CLIENTS · SCHEMATIC TIMELINE, NOT TO SCALE</text>
<text class="dg-name" x="60" y="92" style="text-anchor:start">Jul 2006</text>
<text class="dg-note" x="60" y="108" text-anchor="start">Twitter launches; its API is</text>
<text class="dg-note" x="60" y="122" text-anchor="start">open early</text>
<text class="dg-name" x="60" y="152" style="text-anchor:start">Jan 2007</text>
<text class="dg-note" x="60" y="168" text-anchor="start">Iconfactory&#x27;s Twitterrific for Mac:</text>
<text class="dg-note" x="60" y="182" text-anchor="start">first bird icon; the app that</text>
<text class="dg-note" x="60" y="196" text-anchor="start">popularized &quot;tweet&quot;</text>
<text class="dg-name" x="60" y="226" style="text-anchor:start">2010</text>
<text class="dg-note" x="60" y="242" text-anchor="start">Twitter buys Tweetie; it becomes</text>
<text class="dg-note" x="60" y="256" text-anchor="start">the official iPhone app</text>
<text class="dg-name" x="60" y="286" style="text-anchor:start">11 Mar 2011</text>
<text class="dg-note" x="60" y="302" text-anchor="start">Ryan Sarver: do not &quot;build client</text>
<text class="dg-note" x="60" y="316" text-anchor="start">apps that mimic or reproduce the</text>
<text class="dg-note" x="60" y="330" text-anchor="start">mainstream Twitter consumer</text>
<text class="dg-note" x="60" y="344" text-anchor="start">client experience&quot;</text>
<text class="dg-name" x="60" y="374" style="text-anchor:start">May 2011</text>
<text class="dg-note" x="60" y="390" text-anchor="start">Twitter buys TweetDeck, reportedly</text>
<text class="dg-note" x="60" y="404" text-anchor="start">for about $40 million</text>
<text class="dg-name" x="340" y="92" style="text-anchor:start">16 Aug 2012</text>
<text class="dg-note" x="340" y="108" text-anchor="start">Sippey announces API v1.1 and new</text>
<text class="dg-note" x="340" y="122" text-anchor="start">Rules of the Road: auth everywhere;</text>
<text class="dg-note" x="340" y="136" text-anchor="start">60 calls an hour (720 for a few),</text>
<text class="dg-note" x="340" y="150" text-anchor="start">not a flat 350; Display Requirements;</text>
<text class="dg-note" x="340" y="164" text-anchor="start">certification for pre-installed apps;</text>
<text class="dg-note" x="340" y="178" text-anchor="start">permission above 100,000 user</text>
<text class="dg-note" x="340" y="192" text-anchor="start">tokens; apps past it may grow to 200%</text>
<text class="dg-name" x="340" y="222" style="text-anchor:start">5 Sep 2012</text>
<text class="dg-note" x="340" y="238" text-anchor="start">v1.1 ships, with six months</text>
<text class="dg-note" x="340" y="252" text-anchor="start">promised to migrate</text>
<text class="dg-name" x="340" y="282" style="text-anchor:start">18 Oct 2012</text>
<text class="dg-note" x="340" y="298" text-anchor="start">Tweetbot for Mac ships at $19.99:</text>
<text class="dg-note" x="340" y="312" text-anchor="start">its token allotment is fixed</text>
<text class="dg-name" x="340" y="342" style="text-anchor:start">Mar 2013</text>
<text class="dg-note" x="340" y="358" text-anchor="start">v1.0&#x27;s retirement moved to 7 May,</text>
<text class="dg-note" x="340" y="372" text-anchor="start">with blackout tests before it</text>
<text class="dg-name" x="340" y="402" style="text-anchor:start">11 Jun 2013</text>
<text class="dg-note" x="340" y="418" text-anchor="start">v1.0 returns 410 Gone</text>
<text class="dg-name" x="620" y="92" style="text-anchor:start">Late Oct 2022</text>
<text class="dg-note" x="620" y="108" text-anchor="start">Elon Musk&#x27;s ownership of Twitter</text>
<text class="dg-note" x="620" y="122" text-anchor="start">begins</text>
<text class="dg-name" x="620" y="152" style="text-anchor:start">12–13 Jan 2023</text>
<text class="dg-note" x="620" y="168" text-anchor="start">Tweetbot, Twitterrific, Echofon and</text>
<text class="dg-note" x="620" y="182" text-anchor="start">other clients stop working,</text>
<text class="dg-note" x="620" y="196" text-anchor="start">with no notice</text>
<text class="dg-name" x="620" y="226" style="text-anchor:start">17 Jan 2023</text>
<text class="dg-note" x="620" y="242" text-anchor="start">@TwitterDev: &quot;Twitter is enforcing</text>
<text class="dg-note" x="620" y="256" text-anchor="start">its long-standing API rules&quot;</text>
<text class="dg-name" x="620" y="286" style="text-anchor:start">19 Jan 2023</text>
<text class="dg-note" x="620" y="302" text-anchor="start">Developer Agreement bars a</text>
<text class="dg-note" x="620" y="316" text-anchor="start">&quot;substitute or similar service or</text>
<text class="dg-note" x="620" y="330" text-anchor="start">product&quot;; Iconfactory ends</text>
<text class="dg-note" x="620" y="344" text-anchor="start">Twitterrific after 16 years</text>
