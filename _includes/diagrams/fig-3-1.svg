<div class="dg-figure" data-fig="fig-3-1" style="--dg-w:864px"><div class="dg-scroll"><svg class="dg" viewBox="0 0 864 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-3-1-title fig-3-1-desc">
<title id="fig-3-1-title">Follow Me Home</title>
<desc id="fig-3-1-desc">A schematic in two parts. Above, a timeline with a break between 1993 and 2017. 1983: Scott Cook and Tom Proulx found Intuit. 1984: Quicken ships, sold through banks first, starting with Bank of Hawaii. A bracket over Quicken&#x27;s early days marks the years in which Cook started the home visits. September 1988: Quicken is the best-selling consumer software product. 1989: Intuit reinstates the Follow Me Home program. 1992: QuickBooks is released and passes the market leader, DacEasy, within two months. 2017: Fortune reports some 10,000 hours of visits a year, hours and not visits. Below, the visit in four steps: an Intuit employee waits beside the Quicken shelf until someone buys a copy; asks to follow the buyer home; watches the first installation without interviewing, because the struggle is the data; and debriefs at once. The layout of a visit is not documented; the drawing is schematic.</desc>
