<div class="dg-figure" data-fig="fig-10-6" style="--dg-w:864px"><div class="dg-scroll"><svg class="dg" viewBox="0 0 864 264" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-10-6-title fig-10-6-desc">
<title id="fig-10-6-title">The review&#x27;s two numbers</title>
<desc id="fig-10-6-desc">Left: completed verified resales per eligible event in France at month 18. The average was 34, above the memo&#x27;s month-18 target of 30, but the median was 11, because a handful of arena nights produced most of the resales; kill criterion K2 fires below 10. Right: the synthetic control&#x27;s estimate of the change in primary sell-through on resale-enabled events, a fall of 0.4 points, with an interval from a fall of 1.3 points to a rise of 0.5. The whole interval lies above the guardrail of no worse than minus 2.0 points, so the guardrail held, but the interval does not rule out a small harm.</desc>
