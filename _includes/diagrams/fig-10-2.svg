<div class="dg-figure" data-fig="fig-10-2" style="--dg-w:864px"><div class="dg-scroll"><svg class="dg" viewBox="0 0 864 448" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-10-2-title fig-10-2-desc">
<title id="fig-10-2-title">The memo at five checkpoints</title>
<desc id="fig-10-2-desc">Five checkpoints left to right, each a rereading of the Verified Resale bet memo. Section 10.1, the bet: month 0, late winter of year 9, revision 0; memo written, first tranche funds discovery; kill criteria K1 and K2 written; taught in this book&#x27;s Chapters 1 to 5 and the Software book&#x27;s Sections 10.4 and 9.2 to 9.3. Section 10.2, designing it: month 4, late spring, revision 1; K1 passed; discovery done, decision to build, Resale team formed, 23 dependencies; this book&#x27;s Chapters 6 to 9, the Software book&#x27;s Sections 9.5, 7.3 and 8.2 to 8.3. Section 10.3, building it: month 9, autumn, revision 2; walking skeleton on the golden path, Rowmate certifying, 14 dependencies; this book&#x27;s Sections 2.5, 3.1 and 3.4, the Software book&#x27;s Sections 11.1 to 11.3. Section 10.4, launching it: month 12, winter of year 10, revision 3; three organizers, Rowmate, one market (France); this book&#x27;s Section 4.5 and Chapters 8 and 9, the Software book&#x27;s Section 11.4. Section 10.5, what Encore learned: month 18, summer of year 10, the memo&#x27;s review; K2 not triggered; Rowmate and Tessera live; this book&#x27;s Sections 3.1 and 5.5, the Software book&#x27;s Section 11.5. A bracket over the first four marks the appetite: 12 months from the memo to the first resold ticket scanned at a gate.</desc>
