<div class="dg-figure" data-fig="fig-10-1" style="--dg-w:864px"><div class="dg-scroll"><svg class="dg" viewBox="0 0 864 528" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-10-1-title fig-10-1-desc">
<title id="fig-10-1-title">Gmail&#x27;s launch, 2001 to 2012</title>
<desc id="fig-10-1-desc">A schematic timeline from 2001 to 2012. Paul Buchheit began Gmail, code-named Caribou, in August 2001 and built a first searchable prototype in about a day; about a dozen people worked on it by launch, on about 300 old Pentium III machines nobody else at Google wanted. Google launched it on 1 April 2004, giving accounts to about 1,000 people outside the company, each able to invite a couple of friends; invitations later sold on eBay for $150 and more. On 6 April 2004, five days after launch, 31 organizations and advocates asked Google to suspend Gmail because it scanned mail to place ads, and California State Senator Liz Figueroa drafted a consent bill. The invitation gate lasted until sign-up opened to all on 14 February 2007. The beta label stayed on the logo until 7 July 2009, when Google removed it from Gmail, Calendar, Docs and Talk together, because business customers did not want something that sounded unfinished. By 2012 Gmail had 425 million active users. Below the timeline, the free storage offered in April 2004 is drawn to scale: Hotmail 2 MB and Yahoo Mail 4 MB are hairlines beside Gmail&#x27;s 1,000 MB, about 500 times Hotmail&#x27;s.</desc>
