<text class="dg-label" x="114.8" y="232" style="text-anchor:start">AUG 2001</text>
<text class="dg-note" x="115" y="248" text-anchor="start">Buchheit starts Caribou;</text>
<text class="dg-note" x="115" y="262" text-anchor="start">prototype in about a day</text>
<text class="dg-label" x="275.0" y="232" style="text-anchor:start">1 APR 2004 · LAUNCH</text>
<text class="dg-note" x="275" y="248" text-anchor="start">1 GB free; ~1,000 outsiders,</text>
<text class="dg-note" x="275" y="262" text-anchor="start">each invites a couple</text>
<text class="dg-note" x="275" y="276" text-anchor="start">of friends</text>
<text class="dg-label" x="447.2" y="232" style="text-anchor:start">14 FEB 2007</text>
<text class="dg-note" x="447" y="248" text-anchor="start">sign-up open to all;</text>
<text class="dg-note" x="447" y="262" text-anchor="start">the gate comes down</text>
<text class="dg-label" x="740.0" y="232" style="text-anchor:start">2012</text>
<text class="dg-note" x="740" y="248" text-anchor="start">425 million</text>
<text class="dg-note" x="740" y="262" text-anchor="start">active users</text>
<text class="dg-label dg-l-link" x="275.0" y="316" style="text-anchor:start">6 APR 2004 · FIVE DAYS IN</text>
<text class="dg-note" x="275" y="332" text-anchor="start">31 organizations ask Google</text>
<text class="dg-note" x="275" y="346" text-anchor="start">to suspend Gmail over ads</text>
<text class="dg-note" x="275" y="360" text-anchor="start">beside scanned mail;</text>
<text class="dg-note" x="275" y="374" text-anchor="start">Figueroa drafts a consent bill</text>
<text class="dg-label" x="590.6" y="316" style="text-anchor:start">7 JUL 2009</text>
<text class="dg-note" x="591" y="332" text-anchor="start">beta label removed, with</text>
<text class="dg-note" x="591" y="346" text-anchor="start">Calendar, Docs and Talk;</text>
<text class="dg-note" x="591" y="360" text-anchor="start">business customers had</text>
<text class="dg-note" x="591" y="374" text-anchor="start">balked at &quot;unfinished&quot;</text>
<text class="dg-eyebrow" x="24" y="400" style="text-anchor:start">FREE STORAGE OFFERED, APRIL 2004 · BARS TO SCALE</text>
