<div class="dg-figure" data-fig="fig-8-1" style="--dg-w:864px"><div class="dg-scroll"><svg class="dg" viewBox="0 0 864 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-8-1-title fig-8-1-desc">
<title id="fig-8-1-title">The road to the App Store</title>
<desc id="fig-8-1-desc">Top: a timeline from June 2007 to October 2008. In June 2007 the first iPhone shipped with no third-party native apps; Apple&#x27;s answer to developers that summer was web applications running in Safari, and some developers jailbroke their phones to run native code. In March 2008 Apple announced a software development kit and a store in which developers set their own prices and keep 70% of the revenue, while Apple hosts, signs and reviews every app. On 10 July 2008 the App Store opened as a section of iTunes 7.7 with more than 500 native applications; iPhone OS 2.0 and the iPhone 3G went on sale the next day; on 14 July Apple announced 10 million downloads in the first weekend. Google&#x27;s Android Market opened that October. Bottom: the path a build took from then on, a schematic. The developer&#x27;s build goes to Apple, which signs and reviews it, so a fix is a submission and not a deploy; the store then delivers the approved version to everyone at once, since staged rollouts came years later; and on the phone the version stays until its owner replaces it. The rules for the whole path are written and revised by the platform owner.</desc>
