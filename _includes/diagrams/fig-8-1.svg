<text class="dg-eyebrow" x="24" y="32" style="text-anchor:start">JUNE 2007 TO OCTOBER 2008 · ONE PLATFORM OWNER'S REVIEW IN FRONT OF ALL THIRD-PARTY SOFTWARE</text>
<text class="dg-label" x="36" y="64" style="text-anchor:start">JUNE 2007</text>
<text class="dg-name" x="36" y="82" style="text-anchor:start">iPhone ships, no native apps</text>
<text class="dg-note" x="36" y="98">Apple&#x27;s answer: web apps in Safari</text>
<text class="dg-note" x="36" y="111">some developers jailbreak for native</text>
<text class="dg-label" x="356" y="64" style="text-anchor:start">MARCH 2008</text>
<text class="dg-name" x="356" y="82" style="text-anchor:start">SDK and store announced</text>
<text class="dg-note" x="356" y="98">developers set prices, keep 70%</text>
<text class="dg-note" x="356" y="111">Apple hosts, signs, reviews every app</text>
<text class="dg-label" x="676" y="64" style="text-anchor:start">OCTOBER 2008</text>
<text class="dg-name" x="676" y="82" style="text-anchor:start">Android Market opens</text>
<text class="dg-note" x="676" y="98">store review becomes</text>
<text class="dg-note" x="676" y="111">the normal path</text>
<text class="dg-label dg-l-accent" x="468" y="232" style="text-anchor:start">10 – 14 JULY 2008</text>
<text class="dg-name" x="468" y="250" style="text-anchor:start">The App Store opens</text>
<text class="dg-note" x="468" y="266">10 JUL  in iTunes 7.7, more than 500 native apps</text>
<text class="dg-note" x="468" y="279">11 JUL  iPhone OS 2.0 and the iPhone 3G on sale</text>
<text class="dg-note" x="468" y="292">14 JUL  10 million downloads in the first weekend</text>
<text class="dg-note" x="52" y="432" text-anchor="start">a fix is a submission,</text>
<text class="dg-note" x="52" y="445" text-anchor="start">not a deploy</text>
<text class="dg-note" x="252" y="432" text-anchor="start">a reviewer stands between</text>
<text class="dg-note" x="252" y="445" text-anchor="start">the build and the user</text>
<text class="dg-note" x="452" y="432" text-anchor="start">no staged rollouts until</text>
<text class="dg-note" x="452" y="445" text-anchor="start">years later</text>
<text class="dg-note" x="652" y="432" text-anchor="start">until its owner replaces it</text>
<text class="dg-note" x="652" y="445" text-anchor="start">with a newer one</text>
