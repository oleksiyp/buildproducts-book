<div class="dg-figure" data-fig="fig-6-3" style="--dg-w:864px"><div class="dg-scroll"><svg class="dg" viewBox="0 0 864 528" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-6-3-title fig-6-3-desc">
<title id="fig-6-3-title">The seven stages and two gulfs</title>
<desc id="fig-6-3-desc">Norman&#x27;s seven stages of action drawn as a loop. From the goal at the top, the side of execution runs down the left: plan the action, specify it, perform it, acting on the world. The side of evaluation runs up the right: perceive the state of the world, interpret it, compare it with the goal. The gulf of execution, the distance between what a person wants to do and what the system lets them see they can do, is bridged by discoverability and mapping; on the butterfly ballot it produced more than 2,000 votes for Buchanan meant for Gore. The gulf of evaluation, the distance between the system&#x27;s state and what the person can perceive and understand of it, is bridged by feedback; on the ballot it produced about 6,600 net votes lost to Gore through overvotes, and in Verified Resale&#x27;s first seller flow a &#x27;Sold&#x27; badge beside a ticket that still looked valid.</desc>
