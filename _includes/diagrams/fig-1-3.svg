<div class="dg-figure" data-fig="fig-1-3" style="--dg-w:864px"><div class="dg-scroll"><svg class="dg" viewBox="0 0 864 588" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-1-3-title fig-1-3-desc">
<title id="fig-1-3-title">Encore&#x27;s products, customers and teams</title>
<desc id="fig-1-3-desc">A map of Encore&#x27;s 40 stream-aligned teams, of about nine engineers each, and its platform group. Four kinds of customer sit at the top, each served by one product. The fan storefront and app serves fans with 9 teams, such as Fan Discovery, Seat Map, Checkout, Mobile App and Design System, and watches the share of admitted fans who complete a purchase. The organizer console serves organizers with 7 teams, such as Organizer Console, Event Setup, Pricing &amp; Presales, Festivals and Forecasting, and watches the time from contract to first event on sale. The partner and public APIs serve partners with 3 teams, Public API, Partner APIs and Embeds &amp; Channels, and watch partner integrations certified and live. Encore SaaS for venues serves venue tenants with 7 teams, such as Tenant Onboarding, Tenant Configuration, Box Office and Venue Entry, and watches the days from signature to a venue&#x27;s first sale. Beneath all four products, 14 shared-domain teams, such as On-Sale, Bot Screening, Inventory, Orders &amp; Payments and Fan Messaging, serve all four kinds of customer through the products; each domain watches its service levels, set with its consumers. Beneath the stream-aligned teams, the internal platform, 9 platform teams of 40 people such as Reliability, Runtime, Developer Portal and AI Platform, serves Encore&#x27;s own teams and watches the share of services on the golden path.</desc>
