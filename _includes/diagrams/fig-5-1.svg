<div class="dg-figure" data-fig="fig-5-1" style="--dg-w:864px"><div class="dg-scroll"><svg class="dg" viewBox="0 0 864 444" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-5-1-title fig-5-1-desc">
<title id="fig-5-1-title">Amazon&#x27;s DVD price test, 2000</title>
<desc id="fig-5-1-desc">Schematic. Top: two browser windows open on amazon.com at the same moment, each showing the DVD of Men in Black, one of the 68 titles in the test. Computerworld reported the title at $25.97 in Netscape and $23.97 in Internet Explorer, two dollars apart. Bottom, the episode in five steps: in September 2000 a five-day test set the discount on each title at random between 20% and 40%; customers on an online fan forum compared notes and found the same disc at different prices, and suspected that loyal customers paid more than new ones; Amazon&#x27;s first explanation, routine tests of the navigation, site design and product pricing, satisfied nobody; by 14 September it had refunded 6,896 customers an average of $3.10, a little over $21,000 in all; and its statement of 27 September called the test a mistake and promised that in any future test every buyer would automatically receive the lowest test price.</desc>
