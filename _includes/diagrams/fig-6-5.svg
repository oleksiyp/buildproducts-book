<div class="dg-figure" data-fig="fig-6-5" style="--dg-w:864px"><div class="dg-scroll"><svg class="dg" viewBox="0 0 864 328" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-6-5-title fig-6-5-desc">
<title id="fig-6-5-title">Problems found per users tested</title>
<desc id="fig-6-5-desc">Nielsen and Landauer&#x27;s model: if each user reveals a given problem with probability L, n users find a share 1 minus (1 minus L) to the power n of the problems. With Nielsen&#x27;s average L of 31%, the curve rises steeply and flattens: five users find about 84%. Faulkner&#x27;s 2003 test of 60 users shows the spread behind the average: random sets of five found anywhere from 55% to 99% of the problems, ten users raised the minimum to 80%, and twenty to 95%.</desc>
