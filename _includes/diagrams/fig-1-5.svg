<div class="dg-figure" data-fig="fig-1-5" style="--dg-w:864px"><div class="dg-scroll"><svg class="dg" viewBox="0 0 864 372" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-1-5-title fig-1-5-desc">
<title id="fig-1-5-title">Discovery and delivery as two tracks</title>
<desc id="fig-1-5-desc">A schematic of dual-track development across four iterations; the ideas are lettered for illustration only. The discovery track, above, produces validated ideas through research, design and prototypes; the delivery track, below, produces releasable software. Each idea tested in discovery in one iteration is built in delivery in the next: idea A is tested in iteration 1 and built in 2, B in 2 and built in 3, D in 3 and built in 4, while E is tested in 4. Idea C is tested in iteration 2 and dropped, so it is never built. One frame encloses both tracks: the same team works in both, every week; they are not two teams and not two phases. A note quotes Jeff Patton: the most expensive way to test your idea is to build production quality software.</desc>
