<div class="dg-figure" data-fig="fig-7-1" style="--dg-w:864px"><div class="dg-scroll"><svg class="dg" viewBox="0 0 864 424" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-7-1-title fig-7-1-desc">
<title id="fig-7-1-title">The subway&#x27;s signs, 1904 to 2014</title>
<desc id="fig-7-1-desc">A schematic timeline, not to scale, drawn as a subway route with one station per event, in two rows. First row, three systems with one name and a standard built twice: 1904, the IRT&#x27;s ceramic mosaic tablets, with no common typeface, arrows or borders; 1940, the IRT, BMT and IND unified under city ownership but still signed three ways; 1966, the Transit Authority engages Unimark and Bob Noorda studies how passengers move; November 1967, the Chrystie Street Connection joins IND and BMT services and the confusion becomes a public complaint; before 1968, the Authority&#x27;s Bergen Street sign shop builds signs from Unimark&#x27;s proposal with no instruction and no inspection, the result Vignelli called the biggest mess in the world; 1968, Unimark is rehired; 1970, the Graphics Standards Manual is issued, with Standard Medium type, the black band and modular panels in one-foot units. Second row, two decades of drift, then an owner and a migration: around 1973 the signs switch to white on black against graffiti; through the 1970s fiscal crisis the standard is applied piecemeal; 1979, Paul Goldberger in the New York Times judges the signs confusing; December 1989, the MTA makes Helvetica its official typeface and hires Michael Hertz Associates to update the manual; the 1990s capital programs make the stations coherent. Afterlife: 2012, a copy is found in the basement of Pentagram&#x27;s New York office; 2014, the reissue&#x27;s Kickstarter raises $802,812 from about 6,700 backers. The 1970 manual and the 1989 owner are highlighted; the route between them is dashed, for the piecemeal years.</desc>
