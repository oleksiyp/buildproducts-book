<div class="dg-figure" data-fig="fig-4-4" style="--dg-w:864px"><div class="dg-scroll"><svg class="dg" viewBox="0 0 864 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-4-4-title fig-4-4-desc">
<title id="fig-4-4-title">Randomizing fans or events</title>
<desc id="fig-4-4-desc">Left, randomized by fan: treatment and control fans of one event buy from the same pool of resale listings. If treated fans buy more, they take seats control fans would otherwise have bought, so control finds fewer left and the difference is mostly a transfer between arms. Right, randomized by event, the cluster design: all fans of event A see one fee presentation and buy from A&#x27;s listings, all fans of event B see the other and buy from B&#x27;s, so the interference stays inside each event. Fans who browse several events still leak across clusters at the edges. In Encore&#x27;s experiment 38 organizers let about 520 of their events be randomized, so its precision is that of about 520 units, not of the millions of fans inside them.</desc>
