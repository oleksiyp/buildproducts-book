<div class="dg-figure" data-fig="fig-7-5" style="--dg-w:864px"><div class="dg-scroll"><svg class="dg" viewBox="0 0 864 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-7-5-title fig-7-5-desc">
<title id="fig-7-5-title">The organizer console&#x27;s shell and remotes</title>
<desc id="fig-7-5-desc">In the organizer&#x27;s browser, the console shell, owned by the Organizer Console team with a 110 KB JavaScript budget, owns routing, the organizer&#x27;s session, the tenant and its theme, error boundaries and the navigation frame; its objective is that 99.9% of console page loads render the shell and the requested remote without an error boundary firing, over 28 days. At runtime it loads the remotes, each shipping on its owner&#x27;s schedule within 80 KB of JavaScript beyond the shared singletons: Onboarding, Event Setup, Pricing &amp; Presales, Festivals (Setlist adoption 44%), Insights and Forecasting, with the resale rules console planned as the seventh. Beneath them, four shared singletons are loaded once for the page: react, react-dom, @encore/setlist and @encore/session. Served beside the browser: a discovery manifest, fetched by the shell at startup, names the current version of each remote, so a remote&#x27;s owner releases or rolls back by changing one entry; and the organizer backend for frontend, owned by the Organizer Console team.</desc>
