<div class="dg-figure" data-fig="fig-9-4" style="--dg-w:864px"><div class="dg-scroll"><svg class="dg" viewBox="0 0 864 532" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-9-4-title fig-9-4-desc">
<title id="fig-9-4-title">The reissue operation</title>
<desc id="fig-9-4-desc">When a listing sells, the order&#x27;s response names a reissue operation, which passes through three stages: revoke, in which the seller&#x27;s barcode is revoked and joins the revocation lists venue scanners hold for offline validation; issue, in which a new ticket identity and barcode are issued to the buyer; and deliver, in which the new ticket reaches the buyer&#x27;s app and any wallet pass is updated. A failed stage is retried by Encore and reported as such. Most reissues finish in under 30 seconds and 99 percent within four minutes; listings close two hours before doors. The operation is cancellable only until the first stage completes; after that, reversing a reissue needs two people&#x27;s approval at Encore. Below, what a partner reads from the operation: its current stage, the cancellable flag, a done flag, and a result or an error once finished; and the events reissue.completed or reissue.failed. Operations are kept for 30 days.</desc>
