<text class="dg-eyebrow" x="24" y="32" style="text-anchor:start">ONE RESALE · THE OPERATION THE ORDER NAMES</text>
<text class="dg-note" x="808" y="148" text-anchor="middle">DONE</text>
<text class="dg-note" x="188" y="220" text-anchor="start">joins the revocation lists</text>
<text class="dg-note" x="188" y="234" text-anchor="start">gates hold offline</text>
<text class="dg-note" x="388" y="220" text-anchor="start">new barcode, to the buyer</text>
<text class="dg-note" x="588" y="220" text-anchor="start">wallet pass updated, if any</text>
<text class="dg-sub" x="280" y="263">cancellable: true</text>
<text class="dg-sub" x="568" y="263">cancellable: false · reversal needs two approvals at Encore</text>
<text class="dg-note" x="40" y="344" xml:space="preserve">operations/rei_51Vd</text>
<text class="dg-note" x="40" y="359" xml:space="preserve">  stage:        revoke | issue | deliver</text>
<text class="dg-note" x="40" y="374" xml:space="preserve">  cancellable:  true, until stage 1 is done</text>
<text class="dg-note" x="40" y="389" xml:space="preserve">  done:         false while in progress</text>
<text class="dg-note" x="40" y="404" xml:space="preserve">  result | error, once done</text>
<text class="dg-note" x="24" y="444" text-anchor="start">The partner tells its buyer &quot;your ticket is being issued&quot; honestly;</text>
<text class="dg-note" x="24" y="458" text-anchor="start">a failed stage with its retry reads &quot;delayed&quot;, not &quot;lost&quot;</text>
<text class="dg-note" x="552" y="420" text-anchor="start">reissue.completed | reissue.failed</text>
<text class="dg-note" x="24" y="476" text-anchor="start">Listings close 2 h before doors, so the slowest reissue ends long before the turnstile. Operations are kept 30 days.</text>
