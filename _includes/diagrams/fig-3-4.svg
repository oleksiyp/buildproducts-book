<div class="dg-figure" data-fig="fig-3-4" style="--dg-w:864px"><div class="dg-scroll"><svg class="dg" viewBox="0 0 864 448" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-3-4-title fig-3-4-desc">
<title id="fig-3-4-title">Encore&#x27;s Wizard of Oz</title>
<desc id="fig-3-4-desc">Two lanes. In front of the curtain everything a fan touched was real, at four shows in Lyon and Antwerp: the seller lists through &#x27;Resell this ticket&#x27; in My Tickets; the buyer, screened by Bot Screening and the per-buyer limits as in a primary sale, pays face value plus a 10% fee, shown in the all-in price, and the payment is only authorized; it is captured only after the reissue; the buyer then enters with the new barcode. Behind the curtain a rota of four Support agents did the work for each sale: check that the seller bought through the Sale Gate within the per-fan limit; check the promoter&#x27;s rules, resale closing 24 hours before doors and two tickets per fan; cancel the seller&#x27;s ticket and issue a new one with Support&#x27;s old lost-ticket replacement screen; and confirm the old ticket is on the show&#x27;s revocation list. If no reissue is done within 12 hours, the authorization lapses and the listing returns. Sellers were paid by hand after the show.</desc>
