<div class="dg-figure" data-fig="fig-8-4" style="--dg-w:864px"><div class="dg-scroll"><svg class="dg" viewBox="0 0 864 336" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-8-4-title fig-8-4-desc">
<title id="fig-8-4-title">Encore&#x27;s weekly app train</title>
<desc id="fig-8-4-desc">Six day columns, Monday to the following Monday. Monday 12:00: the Mobile App team cuts the release branch, after which only fixes for blocking bugs go in. Monday and Tuesday: a staff beta of about 600 Encore staff and a public beta of about 20,000 fans, triaged by module owners. Wednesday: the release captain, a rotating role, runs a regression pass on the critical journeys, makes the go or no-go call and submits to both stores. Thursday: the release captain begins the rollout if review has cleared. Friday: no rollout step widens while a major on-sale is running, a rule set by the calendar, as for server canaries. The following Monday: the release captain widens the rollout if the halt criteria of Figure 8.5 are clear. A feature that misses the train waits one week; the train never waits for it.</desc>
