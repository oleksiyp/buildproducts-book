<div class="dg-figure" data-fig="fig-4-1" style="--dg-w:864px"><div class="dg-scroll"><svg class="dg" viewBox="0 0 864 376" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-4-1-title fig-4-1-desc">
<title id="fig-4-1-title">Two ways to lay out a field trial</title>
<desc id="fig-4-1-desc">A schematic, not a plan of any real Rothamsted trial. The same field is drawn twice as six columns by four rows of plots, with soil that varies in ways no one could list: a damp corner at the top left and a richer strip along the bottom. Plots given the fertilizer are marked F. Left, arranged by the experimenter: the fertilized plots fill the bottom two rows and so sit on the richer strip, and the fertilizer would be credited for what the soil did. Right, Fisher&#x27;s randomized blocks (1926): the field is divided into four blocks of similar ground, and within each block three of the six plots are given the fertilizer independently and wholly at random. The random plots fall unevenly, but that unevenness is the kind probability can measure.</desc>
