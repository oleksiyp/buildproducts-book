<text class="dg-note" x="48" y="256" text-anchor="start">A DAMP CORNER (TOP LEFT) · A RICHER STRIP (BOTTOM)</text>
<text class="dg-note" x="48" y="272" text-anchor="start">The fertilized plots line up with the richer strip:</text>
<text class="dg-note" x="48" y="286" text-anchor="start">the fertilizer is credited for what the soil did.</text>
