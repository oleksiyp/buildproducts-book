<div class="dg-figure" data-fig="fig-3-6" style="--dg-w:864px"><div class="dg-scroll"><svg class="dg" viewBox="0 0 864 476" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-3-6-title fig-3-6-desc">
<title id="fig-3-6-title">The story map for Verified Resale</title>
<desc id="fig-3-6-desc">A story map. Across the top runs the backbone, six activities in the order the journey happens: organizer sets rules; fan lists through a partner; another fan buys; ticket is reissued; buyer enters; money is paid out. Beneath each activity its details sit in three release slices, each a complete journey. First slice: a resale window and per-fan limits with the face-value cap only; Rowmate only, for one organizer&#x27;s events; Bot Screening and per-buyer limits; a new barcode issued and the old one revoked; one venue in Lyon; the fee split recorded, with payouts after the event. Launch slice: an off switch and a lower cap; Encore&#x27;s own app as well; the all-in price with the fee shown up front; the wallet pass replaced and a &#x27;your ticket sold&#x27; message; three organizers&#x27; venues in France; the organizer share on every tier. Later: a plain-language rule assistant; Tessera; nothing further for buying or reissue; more markets; nothing further for payouts.</desc>
