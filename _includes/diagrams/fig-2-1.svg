<div class="dg-figure" data-fig="fig-2-1" style="--dg-w:864px"><div class="dg-scroll"><svg class="dg" viewBox="0 0 864 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-2-1-title fig-2-1-desc">
<title id="fig-2-1-title">Apple&#x27;s four-quadrant grid</title>
<desc id="fig-2-1-desc">Schematic of the whiteboard grid Steve Jobs drew at an Apple product strategy session in 1997, as Walter Isaacson describes it: one horizontal and one vertical line, the columns headed Consumer and Pro, the rows labelled Desktop and Portable. The quadrants show the product that filled each: consumer desktop, the iMac, announced May 1998 and shipped August 1998; pro desktop, the Power Macintosh G3, announced November 1997; pro portable, the PowerBook G3; consumer portable, the iBook, unveiled at Macworld New York on 21 July 1999 at $1,599, highlighted because the slot stayed empty for more than a year. A timeline at the right lists the events in order: September 1997, Jobs becomes interim chief executive; November 1997, Power Macintosh G3 announced; May 1998, iMac announced, and TidBITS describes the four-slot strategy with the consumer portable slot empty; August 1998, iMac ships; July 1999, iBook unveiled and the grid is full. A highlighted bar marks the empty slot from the TidBITS report to the iBook. Notes give the results: a loss of about $1.05 billion in fiscal 1997 and a profit of $309 million on $5.94 billion of revenue in fiscal 1998. The layout of the whiteboard is schematic; only its lines and four words are documented.</desc>
