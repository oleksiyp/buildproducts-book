<div class="dg-figure" data-fig="fig-6-1" style="--dg-w:864px"><div class="dg-scroll"><svg class="dg" viewBox="0 0 864 484" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-6-1-title fig-6-1-desc">
<title id="fig-6-1-title">The butterfly ballot</title>
<desc id="fig-6-1-desc">A schematic of the presidential page of the Palm Beach County punch-card ballot of 7 November 2000, after the photograph reproduced by Wand et al. (2001). Ten tickets are split across two facing pages with one column of punch holes down the spine between them. The left page lists, in order, Bush (Republican), Gore (Democratic), Browne (Libertarian), Nader (Green), Harris (Socialist Workers) and Hagelin (Natural Law); their arrows point right to holes 3, 5, 7, 9, 11 and 13. The right page lists Buchanan (Reform), McReynolds (Socialist), Phillips (Constitution) and Moorehead (Workers World), whose arrows point left to holes 4, 6, 8 and 10, followed by a write-in box; position 12, beside it, has no arrow. The holes alternate between the pages. Gore is the second name on the left, but the second hole, number 4, is Buchanan&#x27;s; Gore&#x27;s is the third, number 5. A voter who counted down the left page and punched the second hole voted for Buchanan.</desc>
