<text class="dg-note" x="24" y="400" text-anchor="start">READ DOWN THE LEFT PAGE: BUSH IS THE 1ST NAME AND HAS THE 1ST HOLE (#3).</text>
<text class="dg-note" x="24" y="416" text-anchor="start">GORE IS THE 2ND NAME, BUT THE 2ND HOLE (#4) IS BUCHANAN&#x27;S. GORE&#x27;S IS THE 3RD (#5).</text>
<text class="dg-note" x="24" y="432" text-anchor="start">THE ARROWS ARE CORRECT; THE READING ORDER CONTRADICTS THEM.</text>
<text class="dg-note" x="840" y="432" text-anchor="end">SCHEMATIC, AFTER WAND ET AL. 2001, FIG. 1</text>
