<div class="dg-figure" data-fig="fig-8-6" style="--dg-w:864px"><div class="dg-scroll"><svg class="dg" viewBox="0 0 864 548" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-8-6-title fig-8-6-desc">
<title id="fig-8-6-title">Reissue, and where the guarantee lives</title>
<desc id="fig-8-6-desc">When a ticket is resold, Encore&#x27;s Inventory team reissues it. The old ticket identity joins the revocation list held by every gate scanner, which Venue Entry&#x27;s software syncs every 30 seconds while it has a connection and which may run offline for up to four hours; each scanner holds the per-ticket secrets it needs and accepts one time step either side. The buyer&#x27;s app receives a new identity and a new secret, and computes rotating codes from the secret and a clock corrected at each sync; the gate admits them. The seller&#x27;s app can still generate well-formed codes from the old secret, and every gate refuses them. Wallet passes are updated through Fan Messaging on a best-effort basis, the seller&#x27;s marked Transferred and the buyer&#x27;s newly delivered; they are a courtesy, and a static or rotating wallet barcode is checked against the same list. Bottom, a schematic of the event day: the default resale window runs from purchase until two hours before doors open, so every revocation exists before the first fan reaches a gate; a scanner that has synced once after the window closed holds the complete list, and one that has not shows an amber status to the gate supervisor. Nothing the fan&#x27;s phone does is part of the guarantee.</desc>
