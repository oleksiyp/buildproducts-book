<div class="dg-figure" data-fig="fig-2-4" style="--dg-w:864px"><div class="dg-scroll"><svg class="dg" viewBox="0 0 864 648" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-2-4-title fig-2-4-desc">
<title id="fig-2-4-title">Verified Resale on a Wardley map</title>
<desc id="fig-2-4-desc">A Wardley map. The vertical axis is visibility to the fan, from the need at the top through components the fan sees, those met at the door, those seen by organizers, to those nobody sees; the horizontal axis is evolution, from genesis through custom and product to commodity. The anchor is the need: a fan holds a guaranteed ticket. Seen by the fan, in product: listing and storefront (partners already run good ones; leave them open), checkout with the all-in price (reuse the primary checkout) and wallet passes (Apple and Google supply them). At the door: rotating barcodes and gate revocation lists, custom and moving toward product (own them now and watch them evolve). Seen by organizers: organizer resale rules, between genesis and custom (own them and expect to learn fast). Unseen: reissue under a new ticket identity, custom and highlighted as Encore&#x27;s advantage (own it); buyer screening, custom on rented signals (reuse Bot Screening as it is); the fee split in the finance ledger, custom on a commodity ledger (extend what exists); and payments with split payouts, spanning product and commodity (the primary PSP&#x27;s marketplace product carries it). The placements are the trio&#x27;s judgments.</desc>
